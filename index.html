<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Letter for Busra ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #050508;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a0b1c 0%, #050508 100%);
        }

        /* --- Page 1: Gift Card Screen --- */
        #card-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            transition: opacity 1.2s ease, transform 1.2s ease;
        }

        .gift-card {
            width: 320px;
            height: 220px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 75, 110, 0.2);
            cursor: pointer;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            position: relative;
            padding: 20px;
            text-align: center;
        }

        .gift-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 75, 110, 0.4);
        }

        .card-heart-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite alternate;
        }

        .card-title {
            font-family: 'Great Vibes', cursive;
            font-size: 2.2rem;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 75, 110, 0.8);
            margin-bottom: 5px;
        }

        .open-btn {
            margin-top: 35px;
            padding: 12px 30px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 1px;
            color: #ffffff;
            background: linear-gradient(45deg, #ff4b6e, #ff8fa3);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 75, 110, 0.5);
            transition: all 0.3s ease;
            animation: bounce 2s infinite;
        }

        .open-btn:hover {
            background: linear-gradient(45deg, #ff2a55, #ff7591);
            box-shadow: 0 15px 30px rgba(255, 75, 110, 0.7);
            transform: scale(1.05);
        }

        /* --- Page 2: Heart Animation Screen --- */
        #heart-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            position: relative;
            text-align: center;
            z-index: 10;
        }

        canvas {
            display: block;
            filter: drop-shadow(0 0 25px rgba(255, 75, 110, 0.4));
        }

        .message-box {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 35px;
            border-radius: 50px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: floatBox 3s ease-in-out infinite alternate;
        }

        .subtitle {
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 4px;
            color: #ff94b8;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .main-title {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 75, 110, 0.8);
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(255, 75, 110, 0.5)); }
            100% { transform: scale(1.15); filter: drop-shadow(0 0 20px rgba(255, 75, 110, 0.9)); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }

        @keyframes floatBox {
            0% { transform: translate(-50%, 0); }
            100% { transform: translate(-50%, -10px); }
        }

        .hide {
            opacity: 0 !important;
            transform: scale(0.8) !important;
            pointer-events: none !important;
        }

        .show {
            opacity: 1 !important;
            pointer-events: auto !important;
        }
    </style>
</head>
<body>

    <!-- First Screen: Gift Card -->
    <div id="card-screen">
        <div class="gift-card" onclick="openGift()">
            <div class="card-heart-icon">💌</div>
            <div class="card-title">A letter to someone special...</div>
        </div>
        <button class="open-btn" onclick="openGift()">Open for your gift ✨</button>
    </div>

    <!-- Second Screen: 3D Heart Animation -->
    <div id="heart-screen">
        <div class="container">
            <canvas id="heartCanvas"></canvas>
            <div class="message-box">
                <div class="subtitle">This is my love for</div>
                <div class="main-title">Busra ❤️</div>
            </div>
        </div>
    </div>

    <script>
        const cardScreen = document.getElementById('card-screen');
        const heartScreen = document.getElementById('heart-screen');
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Generate 3D Heart Points
        const points = [];
        const textWords = "I LOVE YOU BUSRA ❤️ ";
        let wordIndex = 0;

        for (let a = 0; a < Math.PI * 2; a += 0.08) {
            let x = 16 * Math.pow(Math.sin(a), 3);
            let y = -(13 * Math.cos(a) - 5 * Math.cos(2*a) - 2 * Math.cos(3*a) - Math.cos(4*a));
            
            for (let z = -2; z <= 2; z += 0.5) {
                points.push({
                    x: x * 15,
                    y: y * 15,
                    z: z * 15,
                    char: textWords[wordIndex % textWords.length]
                });
                wordIndex++;
            }
        }

        let angle = 0;
        let animationStarted = false;

        function animate() {
            if (!animationStarted) return;

            ctx.fillStyle = 'rgba(5, 5, 8, 0.2)';
            ctx.fillRect(0, 0, width, height);

            const cx = width / 2;
            const cy = height / 2 - 40;

            angle += 0.01;

            const projectedPoints = points.map(p => {
                let x1 = p.x * Math.cos(angle) - p.z * Math.sin(angle);
                let z1 = p.z * Math.cos(angle) + p.x * Math.sin(angle);
                let y1 = p.y;

                let fov = 350;
                let scale = fov / (fov + z1 + 200);
                
                return {
                    x: cx + x1 * scale,
                    y: cy + y1 * scale,
                    scale: scale,
                    alpha: (z1 + 50) / 100 + 0.5,
                    char: p.char
                };
            });

            projectedPoints.forEach(p => {
                ctx.save();
                ctx.font = `${Math.max(8, p.scale * 16)}px 'Poppins', sans-serif`;
                ctx.fillStyle = `rgba(255, 105, 150, ${Math.max(0.2, Math.min(1, p.alpha))})`;
                ctx.shadowColor = '#ff4b6e';
                ctx.shadowBlur = 8;
                ctx.fillText(p.char, p.x, p.y);
                ctx.restore();
            });

            requestAnimationFrame(animate);
        }

        function openGift() {
            cardScreen.classList.add('hide');
            
            setTimeout(() => {
                heartScreen.classList.add('show');
                animationStarted = true;
                animate();
            }, 600);
        }
    </script>
</body>
</html>
